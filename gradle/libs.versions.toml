# Каталог версий. Стабильные версии на момент Этапа 1 (docs/05_roadmap.md).
# Room / Retrofit / OkHttp / kotlinx-serialization подключаются к :app на Этапе 2.

[versions]
agp = "8.7.3"
kotlin = "2.1.21"
ksp = "2.1.21-2.0.2"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
