# Настройки detekt для проекта (создан на Этапе 1, docs/05_roadmap.md).
# База — default-конфиги detekt (buildUponDefaultConfig = true).

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    active: false
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false
  # Этап 3: алгоритмы BFS/генерации по сути ветвистые (бюджет, кэш, валидные
  # состояния NOT_FOUND/BUDGET_EXCEEDED) — пороги скорректированы под них.
  CyclomaticComplexMethod:
    threshold: 25
  NestedBlockDepth:
    threshold: 6

style:
  MaxLineLength:
    maxLineLength: 120
  MagicNumber:
    active: false
  ReturnCount:
    max: 10
  LoopWithTooManyJumpStatements:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
